<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ Для моей Любимой❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>❤️ Моя любимая девочка ❤️</h1>
        <p class="subtitle">Ты — лучшее, что случалось со мной, даже когда я был пьян</p>
        
        <div class="player-wrapper">
            <iframe 
                width="100%" 
                height="166" 
                scrolling="no" 
                frameborder="no" 
                allow="autoplay" 
                src="https://w.soundcloud.com/player/?url=https://on.soundcloud.com/032bNCNGBtvLHbDlmE&color=ff2d55&auto_play=true&hide_related=false&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">
            </iframe>
        </div>

        <div class="counter">
            Мы вместе уже <span id="days">156</span> дней ❤️
        </div>

        <button onclick="showLove()">Нажми сюда, если я тебя люблю</button>
        <p id="message" class="love-message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
