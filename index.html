<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ Для моей Зайки ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>❤️ Моя любимая девочка ❤️</h1>
        <p class="subtitle">Ты — лучшее, что случалось со мной, даже когда я был пьян</p>
        
        <!-- ВСТРОЕННЫЙ ПЛЕЕР (РАБОТАЕТ 100%) -->
        <div class="player-wrapper">
            <iframe 
                width="100%" 
                height="166" 
                scrolling="no" 
                frameborder="no" 
                allow="autoplay; encrypted-media" 
                src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/2132114875&color=%23ff2d55&auto_play=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false"
                style="border-radius: 20px; border: none; box-shadow: 0 8px 30px rgba(0,0,0,0.15);">
            </iframe>
        </div>

        <div class="counter">
            Мы вместе уже <span id="days">0</span> дней ❤️
        </div>

        <button onclick="showLove()">Нажми сюда, если я тебя люблю</button>
        <p id="message" class="love-message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
